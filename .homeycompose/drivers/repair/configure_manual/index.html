<style>
  @import '/css/deprecated-login-credentials.css';

  html {
    height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    height: 100%;
    margin: 0;
  }

  .__private__homey-login-credentials {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
  }

  .__private__homey-login-credentials__form {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    min-height: 0;
    height: 100%;
    box-sizing: border-box;
  }

  .__private__homey-login-credentials__center {
    width: 100%;
    flex-shrink: 0;
    margin-top: 0 !important;
    margin-bottom: 0 !important;
  }

  .pair-view-flex-spacer {
    flex-grow: 1;
    flex-shrink: 0;
    min-height: var(--homey-su-2);
  }

  .__private__homey-login-credentials__footer {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: var(--homey-su-2);
  }

  #login-credentials-title {
    margin-bottom: var(--homey-su-1);
  }

  #login-credentials-subtitle {
    margin-top: 0;
    margin-bottom: var(--homey-su-4);
  }

  .homey-form-input-large.read-only-input {
    background-color: #e9ecef !important;
    color: #6c757d !important;
    border-color: #ced4da !important;
    pointer-events: none !important;
  }
</style>

<div class="__private__homey-login-credentials">
  <form
    id="configure-manual-form"
    class="__private__homey-login-credentials__form homey-form"
    action="/"
    method="post"
  >
    <div class="__private__homey-login-credentials__center">
      <h1
        id="login-credentials-title"
        class="homey-title homey-text-align-center"
        data-i18n="repair.configure_manual.title"
      ></h1>
      <p
        id="login-credentials-subtitle"
        class="homey-subtitle homey-text-align-center"
        data-i18n="repair.configure_manual.subtitle"
      ></p>

      <div class="homey-form-group-large" id="mac-group" hidden>
        <label
          class="homey-form-label"
          for="device-mac"
          data-i18n="pair.configure_manual.macLabel"
        ></label>
        <input
          class="homey-form-input-large read-only-input"
          id="device-mac"
          type="text"
          value=""
          readonly
        />
      </div>

      <div class="homey-form-group-large">
        <label
          class="homey-form-label"
          for="device-host"
          data-i18n="pair.configure_manual.hostLabel"
        ></label>
        <input
          class="homey-form-input-large"
          id="device-host"
          type="text"
          value=""
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          data-i18n-placeholder="pair.configure_manual.hostPlaceholder"
        />
      </div>

      <div class="homey-form-group-large">
        <label
          class="homey-form-label"
          for="device-port"
          data-i18n="pair.configure_manual.portLabel"
        ></label>
        <input
          class="homey-form-input-large"
          id="device-port"
          type="number"
          min="1"
          max="65535"
          value="6053"
          data-i18n-placeholder="pair.configure_manual.portPlaceholder"
        />
      </div>
    </div>

    <div class="pair-view-flex-spacer" aria-hidden="true"></div>

    <div class="__private__homey-login-credentials__footer">
      <button
        tabindex="0"
        class="homey-button-primary-shadow-full __private__homey-login-credentials__button"
        id="next"
        data-i18n="pair.configure_manual.connect"
        type="submit"
      ></button>
      <button
        type="button"
        class="homey-button-secondary-shadow-full"
        id="btn-back"
        data-i18n="repair.show_key.back"
      ></button>
    </div>
  </form>
</div>

<script type="text/javascript">
  (function () {
    var $host = document.getElementById('device-host');
    var $port = document.getElementById('device-port');
    var $mac = document.getElementById('device-mac');
    var $macGroup = document.getElementById('mac-group');

    Homey.setTitle(null);

    // Homey Previous is off (`navigation: false`).
    document.getElementById('btn-back').addEventListener('click', function () {
      Homey.showView('maintenance');
    });

    function applyPrefill(data) {
      if (!data) return;
      if (data.mac) {
        $mac.value = data.mac;
        $macGroup.hidden = false;
      }
      if (data.host) $host.value = data.host;
      $port.value = data.port || '';
    }

    Homey.on('prefill', applyPrefill);
    Homey.emit('get_connection').then(applyPrefill);

    document
      .getElementById('configure-manual-form')
      .addEventListener('submit', function (event) {
        event.preventDefault();

        var btn = document.getElementById('next');
        if (btn.classList.contains('is-loading')) return;
        btn.classList.add('is-loading');

        Homey.emit('configure_manual', {
          host: $host.value,
          port: $port.value,
        })
          .then(function (next) {
            // Repair returns no view once the connection is applied.
            if (next) {
              Homey.showView(next);
            } else {
              Homey.done();
            }
          })
          .catch(function (err) {
            btn.classList.remove('is-loading');
            Homey.alert(err);
          });

        return false;
      });
  })();
</script>
